openapi: 3.1.0
info:
  version: 1.0.0
  title: Contact web app
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: keep your contacts save with this web app
tags:
  - name: Contacts
    description: Operations about contacts
servers:
  - url: http://localhost:3000
  - url: https://swagger-drcf.onrender.com
paths:
  /contacts:
    get:
      $ref: ../swagger/paths/contacts/get.yaml
    post:
      $ref: ../swagger/paths/contacts/post.yaml
  /contacts/{id}:
    get:
      $ref: ../swagger/paths/contacts/{id}/get.yaml
    patch:
      $ref: ../swagger/paths/contacts/{id}/patch.yaml
    delete:
      $ref: ../swagger/paths/contacts/{id}/delete.yaml
  /auth/register:
    post:
      $ref: '../swagger/paths/auth/post/register.yaml'
  /auth/login:
    post:
      $ref: '../swagger/paths/auth/post/login.yaml'
  /auth/send-reset-email:
    post:
      $ref: '../swagger/paths/auth/post/sendResetEmail.yaml'
  /auth/reset-pwd:
    post:
      $ref: '../swagger/paths/auth/post/resetPwd.yaml'
  /auth/refresh:
    post:
      $ref: '../swagger/paths/auth/post/refresh.yaml'
  /auth/logout:
    post:
      $ref: '../swagger/paths/auth/post/logout.yaml'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
