tags:
  - Auth
summary: Register a user
operationId: registerUser
description: Register a user
security:
  - bearerAuth: []
requestBody:
  content:
    application/json:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's name"
            type: string
            example: 'Anna'
          email:
            description: "User's email"
            type: string
            example: example@gmail.com
          password:
            description: "User's password"
            type: string
responses:
  '201':
    description: Register a user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully registered a user!
            data:
              type: object
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  example: 'Anna'
                email:
                  type: string
                  example: example@gmail.com
  '409':
    description: Conflict
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 409
            message:
              type: string
              example: 'Email in use'
